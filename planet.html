<head>
<title>My Planet Explorer</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
body { background-color: #f0f4ff; }
.navbar { background-color: #1a237e; }
.navbar-brand, .nav-link { color: #fff !important; }
.section-title { color: #1a237e; margin: 20px 0 10px; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="#">Planet Explorer</a>
  <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
      <li class="nav-item"><a class="nav-link" href="#">stars</a></li>
  </ul>
</nav>
<div class="container">
  <h4 class="section-title">Scanning the Galaxy...</h4>
  <div class="spinner-border text-primary" role="status"></div>
  <div class="spinner-border text-warning" role="status"></div>
     <div class="spinner-border text-danger" role="status"></div>
  </div>

  <div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
            <h5 class="card-title">Earth</h5>
            <p class="card-text">Our home planet - the only one known to have life.</p>
            <a href="#" class="btn btn-primary">Explore</a>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
            <h5 class="card-title">Mars</h5>
            <p class="card-text">The Red Planet - our nearest neighbor in the solar system.</p>
            <a href="#" class="btn btn-primary">Explore</a>
            </div>
        </div>
    </div>

    
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
            <h5 class="card-title">Mercury</h5>
            <p class="card-text">The smallest planet and closest to the Sun.</p>
            <a href="#" class="btn btn-primary">Explore</a>
            </div>
            </div>
            </div>
    </div>
</body>
</html>
