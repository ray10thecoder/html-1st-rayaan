<html>
<body>
<section>
<img class="slider1" src="pici.jpg" height="500px">
<img class="slider1" src="pic.jpg" height="500px">
</section>
<section>
<img class="slider3" src="picci.jpg" height="500px">
<img class="slider3" src="picii.jpg" height="500px">
<audio class="slider3" src="puppy.wav" height="500px">
</audio>
</section>
<section>
<img class="slider2" src="ron.jpg" height="500px">
<img class="slider2" src="ronny.jpg" height="500px">

</section>
<script>
var myIndex = 0;
carousel();
function carousel() {
    var i;
        var x = document.getElementsByClassName("slider");
        for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";  
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}    
        x[myIndex-1].style.display = "block";  
        setTimeout(carousel, 2000); // Change image every 2 seconds
    }
</script>
</body>
</html>
