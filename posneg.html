<html>
<head>
<title>Replit</title>
</head>
<body>
<script>
  let positiveOrNegative = function() {
    if (number > 0) {
      document.write(number + " is a positive number.");
    } else {
      document.write(number + " is a negative number.");
    }
  };
  let number = prompt("Enter a number:");
  positiveOrNegative();
</script>
</body>
</html>
